server:
  port: 8761

spring:
  security:
    user:
      name: ${EUREKA_ADMIN_USER:admin}
      password: ${EUREKA_ADMIN_PASSWORD:password}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
# Helpful note for clients: teams should configure their services with the following property
# eureka.client.serviceUrl.defaultZone: http://${EUREKA_ADMIN_USER:admin}:${EUREKA_ADMIN_PASSWORD:password}@<eureka-service>.<namespace>.svc.cluster.local:8761/eureka/

