name: CI/CD - Customer & Vehicle Services

on:
    push:
        branches: [main, develop, chatbot]
        paths:
            - "services/customer-service/**"
            - "services/vehicle-service/**"
            - "shared-libs/**"
            - ".github/workflows/ci-customer-vehicle.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "services/customer-service/**"
            - "services/vehicle-service/**"
            - "shared-libs/**"

env:
    FLYWAY_VERSION: 11.7.2
    POSTGRES_VERSION: "15"
    JAVA_VERSION: "21"

jobs:
    # ==========================================
    # Job 1: Build Shared Libraries
    # ==========================================
    build-shared-libs:
        name: Build shared libraries
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: "maven"

            - name: Make Maven wrapper executable
              run: chmod +x ./mvnw

            - name: Build shared libraries
              run: ./mvnw -B -U -DskipTests clean install -pl shared-libs/common-dto,shared-libs/common-utils,shared-libs/event-models,shared-libs/security-lib

            - name: Upload shared lib artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: shared-libs
                  path: |
                      shared-libs/*/target/*.jar
                  retention-days: 1

    # ==========================================
    # Job 2: Build Customer Service
    # ==========================================
    build-customer-service:
        name: Build customer-service
        runs-on: ubuntu-latest
        needs: build-shared-libs

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: "maven"

            - name: Download shared libraries
              uses: actions/download-artifact@v4
              with:
                  name: shared-libs
                  path: shared-libs/

            - name: Make Maven wrapper executable
              run: chmod +x ./mvnw

            - name: Build customer-service
              run: ./mvnw -B -U -DskipTests clean install -pl services/customer-service -am

            - name: Upload customer-service artifact
              uses: actions/upload-artifact@v4
              with:
                  name: customer-service-jar
                  path: services/customer-service/target/*.jar
                  retention-days: 1

    # ==========================================
    # Job 3: Build Vehicle Service
    # ==========================================
    build-vehicle-service:
        name: Build vehicle-service
        runs-on: ubuntu-latest
        needs: build-shared-libs

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: "maven"

            - name: Download shared libraries
              uses: actions/download-artifact@v4
              with:
                  name: shared-libs
                  path: shared-libs/

            - name: Make Maven wrapper executable
              run: chmod +x ./mvnw

            - name: Build vehicle-service
              run: ./mvnw -B -U -DskipTests clean install -pl services/vehicle-service -am

            - name: Upload vehicle-service artifact
              uses: actions/upload-artifact@v4
              with:
                  name: vehicle-service-jar
                  path: services/vehicle-service/target/*.jar
                  retention-days: 1

    # ==========================================
    # Job 4: Unit Tests - Customer Service
    # ==========================================
    test-customer-service:
        name: Unit tests - customer-service
        runs-on: ubuntu-latest
        needs: build-customer-service

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: "maven"

            - name: Download shared libraries
              uses: actions/download-artifact@v4
              with:
                  name: shared-libs
                  path: shared-libs/

            - name: Make Maven wrapper executable
              run: chmod +x ./mvnw

            - name: Run unit tests
              run: ./mvnw -B test -pl services/customer-service

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: customer-service-test-results
                  path: services/customer-service/target/surefire-reports/
                  retention-days: 7

    # ==========================================
    # Job 5: Unit Tests - Vehicle Service
    # ==========================================
    test-vehicle-service:
        name: Unit tests - vehicle-service
        runs-on: ubuntu-latest
        needs: build-vehicle-service

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: "maven"

            - name: Download shared libraries
              uses: actions/download-artifact@v4
              with:
                  name: shared-libs
                  path: shared-libs/

            - name: Make Maven wrapper executable
              run: chmod +x ./mvnw

            - name: Run unit tests
              run: ./mvnw -B test -pl services/vehicle-service

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: vehicle-service-test-results
                  path: services/vehicle-service/target/surefire-reports/
                  retention-days: 7

    # ==========================================
    # Job 6: Flyway Migrations - Customer Service
    # ==========================================
    flyway-customer:
        name: Flyway migration - customer-service
        runs-on: ubuntu-latest
        needs: build-customer-service

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: postgres
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres123
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: "maven"

            - name: Make Maven wrapper executable
              run: chmod +x ./mvnw

            - name: Create database and user
              run: |
                  PGPASSWORD=postgres123 psql -h localhost -U postgres -c "CREATE DATABASE as_customer_service;"
                  PGPASSWORD=postgres123 psql -h localhost -U postgres -c "CREATE USER svc_customer_service WITH PASSWORD 'customer_svc_pass_2024';"
                  PGPASSWORD=postgres123 psql -h localhost -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE as_customer_service TO svc_customer_service;"

            - name: Run Flyway migrations
              run: |
                  ./mvnw -pl services/customer-service flyway:migrate \
                    -Dflyway.url=jdbc:postgresql://localhost:5432/as_customer_service \
                    -Dflyway.user=svc_customer_service \
                    -Dflyway.password=customer_svc_pass_2024

            - name: Verify migration
              run: |
                  PGPASSWORD=customer_svc_pass_2024 psql -h localhost -U svc_customer_service -d as_customer_service -c "\dt"

    # ==========================================
    # Job 7: Flyway Migrations - Vehicle Service
    # ==========================================
    flyway-vehicle:
        name: Flyway migration - vehicle-service
        runs-on: ubuntu-latest
        needs: build-vehicle-service

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: postgres
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres123
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: "maven"

            - name: Make Maven wrapper executable
              run: chmod +x ./mvnw

            - name: Create database and user
              run: |
                  PGPASSWORD=postgres123 psql -h localhost -U postgres -c "CREATE DATABASE as_vehicle_service;"
                  PGPASSWORD=postgres123 psql -h localhost -U postgres -c "CREATE USER svc_vehicle_service WITH PASSWORD 'vehicle_svc_pass_2024';"
                  PGPASSWORD=postgres123 psql -h localhost -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE as_vehicle_service TO svc_vehicle_service;"

            - name: Run Flyway migrations
              run: |
                  ./mvnw -pl services/vehicle-service flyway:migrate \
                    -Dflyway.url=jdbc:postgresql://localhost:5432/as_vehicle_service \
                    -Dflyway.user=svc_vehicle_service \
                    -Dflyway.password=vehicle_svc_pass_2024

            - name: Verify migration
              run: |
                  PGPASSWORD=vehicle_svc_pass_2024 psql -h localhost -U svc_vehicle_service -d as_vehicle_service -c "\dt"

    # ==========================================
    # Job 8: Docker Build - Customer Service
    # ==========================================
    docker-customer-service:
        name: Docker build - customer-service
        runs-on: ubuntu-latest
        needs: [test-customer-service, flyway-customer]
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub (optional)
              if: github.ref == 'refs/heads/main'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./services/customer-service/Dockerfile
                  push: false
                  tags: gearup/customer-service:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # ==========================================
    # Job 9: Docker Build - Vehicle Service
    # ==========================================
    docker-vehicle-service:
        name: Docker build - vehicle-service
        runs-on: ubuntu-latest
        needs: [test-vehicle-service, flyway-vehicle]
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub (optional)
              if: github.ref == 'refs/heads/main'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./services/vehicle-service/Dockerfile
                  push: false
                  tags: gearup/vehicle-service:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # ==========================================
    # Job 10: Report Status
    # ==========================================
    report-status:
        name: Report CI/CD status
        runs-on: ubuntu-latest
        needs: [docker-customer-service, docker-vehicle-service]
        if: always()

        steps:
            - name: Check job statuses
              run: |
                  echo "Customer Service - Build: ${{ needs.build-customer-service.result }}"
                  echo "Customer Service - Test: ${{ needs.test-customer-service.result }}"
                  echo "Customer Service - Flyway: ${{ needs.flyway-customer.result }}"
                  echo "Customer Service - Docker: ${{ needs.docker-customer-service.result }}"
                  echo ""
                  echo "Vehicle Service - Build: ${{ needs.build-vehicle-service.result }}"
                  echo "Vehicle Service - Test: ${{ needs.test-vehicle-service.result }}"
                  echo "Vehicle Service - Flyway: ${{ needs.flyway-vehicle.result }}"
                  echo "Vehicle Service - Docker: ${{ needs.docker-vehicle-service.result }}"
