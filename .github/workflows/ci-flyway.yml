name: CI - Flyway migrations + integration tests

on:
  push:
    branches: [ main, microservice-initialization ]
  pull_request:
    branches: [ main ]

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: as_notification
          POSTGRES_USER: svc_notification
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svc_notification -d as_notification" 
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      FLYWAY_URL: jdbc:postgresql://localhost:5432/as_notification
      FLYWAY_USER: svc_notification
      FLYWAY_PASSWORD: ${{ env.POSTGRES_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and install all modules
        run: ./mvnw -B -U -DskipTests clean install

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U $FLYWAY_USER && break || sleep 2;
          done
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Run Flyway migrations (notification-service)
        run: |
          ./mvnw "-Dflyway.url=$FLYWAY_URL" "-Dflyway.user=$FLYWAY_USER" "-Dflyway.password=$FLYWAY_PASSWORD" -pl services/notification-service flyway:migrate

      - name: Run integration tests
        run: |
          ./mvnw -DskipTests=false -pl services/notification-service test

      - name: Tear down
        if: always()
        run: echo "Job finished"
