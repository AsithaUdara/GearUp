name: CI/CD - Flyway Migrations & Tests

on:
  push:
    branches: [main, microservice-initialization, develop]
  pull_request:
    branches: [main, develop]

env:
  FLYWAY_VERSION: 11.7.2
  POSTGRES_VERSION: "15"

jobs:
  # ==========================================
  # Job 1: Build All Modules
  # ==========================================
  build:
    name: Build all modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and install all modules (skip tests for now)
        run: ./mvnw -B -U -DskipTests clean install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            services/*/target/*.jar
            api-gateway/target/*.jar
            config-server/target/*.jar
            service-discovery/target/*.jar
          retention-days: 1

  # ==========================================
  # Job 2: Database Migrations
  # ==========================================
  flyway-migrations:
    name: Run Flyway migrations for all services
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service:
          - name: automobile-service
            module: services/automobile-service
            db: as_automobile_service
            user: svc_automobile_service
            password: auto_svc_pass_2024
          - name: notification-service
            module: services/notification-service
            db: as_notification_service
            user: svc_notification_service
            password: notif_svc_pass_2024
          - name: user-auth-service
            module: services/user-auth-service
            db: as_user_auth_service
            user: svc_user_auth_service
            password: auth_svc_pass_2024

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 2
          done
        env:
          PGPASSWORD: postgres123

      - name: Create database and user for ${{ matrix.service.name }}
        run: |
          PGPASSWORD=postgres123 psql -h localhost -U postgres -tc \
            "SELECT 1 FROM pg_database WHERE datname = '${{ matrix.service.db }}'" | \
            grep -q 1 || \
            PGPASSWORD=postgres123 psql -h localhost -U postgres -c \
            "CREATE DATABASE ${{ matrix.service.db }}"

          PGPASSWORD=postgres123 psql -h localhost -U postgres -tc \
            "SELECT 1 FROM pg_roles WHERE rolname = '${{ matrix.service.user }}'" | \
            grep -q 1 || \
            PGPASSWORD=postgres123 psql -h localhost -U postgres -c \
            "CREATE USER ${{ matrix.service.user }} WITH PASSWORD '${{ matrix.service.password }}'"

          PGPASSWORD=postgres123 psql -h localhost -U postgres -c \
            "GRANT ALL PRIVILEGES ON DATABASE ${{ matrix.service.db }} TO ${{ matrix.service.user }}"

          PGPASSWORD=postgres123 psql -h localhost -U postgres -d ${{ matrix.service.db }} -c \
            "GRANT ALL ON SCHEMA public TO ${{ matrix.service.user }}"

          PGPASSWORD=postgres123 psql -h localhost -U postgres -d ${{ matrix.service.db }} -c \
            "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO ${{ matrix.service.user }}"

          PGPASSWORD=postgres123 psql -h localhost -U postgres -d ${{ matrix.service.db }} -c \
            "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO ${{ matrix.service.user }}"

      - name: Run Flyway migrate for ${{ matrix.service.name }}
        run: |
          ./mvnw -pl ${{ matrix.service.module }} \
            -Dflyway.url=jdbc:postgresql://localhost:5432/${{ matrix.service.db }} \
            -Dflyway.user=postgres \
            -Dflyway.password=postgres123 \
            flyway:migrate

      - name: Verify Flyway migration history
        run: |
          ./mvnw -pl ${{ matrix.service.module }} \
            -Dflyway.url=jdbc:postgresql://localhost:5432/${{ matrix.service.db }} \
            -Dflyway.user=postgres \
            -Dflyway.password=postgres123 \
            flyway:info

      - name: Validate migrations
        run: |
          ./mvnw -pl ${{ matrix.service.module }} \
            -Dflyway.url=jdbc:postgresql://localhost:5432/${{ matrix.service.db }} \
            -Dflyway.user=postgres \
            -Dflyway.password=postgres123 \
            flyway:validate

  # ==========================================
  # Job 3: Run Tests
  # ==========================================
  test:
    name: Run unit and integration tests
    runs-on: ubuntu-latest
    needs: [build, flyway-migrations]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service:
          - name: automobile-service
            module: services/automobile-service
            db: as_automobile_service
            user: svc_automobile_service
            password: auto_svc_pass_2024
          - name: notification-service
            module: services/notification-service
            db: as_notification_service
            user: svc_notification_service
            password: notif_svc_pass_2024
          - name: user-auth-service
            module: services/user-auth-service
            db: as_user_auth_service
            user: svc_user_auth_service
            password: auth_svc_pass_2024

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Inject Firebase service account (if provided)
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > firebase-service-account.json
            chmod 600 firebase-service-account.json
            echo "FIREBASE_CONFIG_PATH=$(pwd)/firebase-service-account.json" >> $GITHUB_ENV
          else
            echo "No FIREBASE_SERVICE_ACCOUNT secret provided, skipping"
          fi

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Setup databases
        run: |
          PGPASSWORD=postgres123 psql -h localhost -U postgres <<EOF
          CREATE DATABASE ${{ matrix.service.db }};
          CREATE USER ${{ matrix.service.user }} WITH PASSWORD '${{ matrix.service.password }}';
          GRANT ALL PRIVILEGES ON DATABASE ${{ matrix.service.db }} TO ${{ matrix.service.user }};
          \c ${{ matrix.service.db }}
          GRANT ALL ON SCHEMA public TO ${{ matrix.service.user }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO ${{ matrix.service.user }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO ${{ matrix.service.user }};
          EOF

      - name: Run tests for ${{ matrix.service.name }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.service.db }}
          SPRING_DATASOURCE_USERNAME: ${{ matrix.service.user }}
          SPRING_DATASOURCE_PASSWORD: ${{ matrix.service.password }}
          SPRING_FLYWAY_ENABLED: true
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: guest
          SPRING_RABBITMQ_PASSWORD: guest
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          APP_FIREBASE_CONFIGURATION_FILE: ""
          FIREBASE_CONFIG_PATH: ""
        run: |
          ./mvnw -pl ${{ matrix.service.module }} -am test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service.name }}
          path: |
            ${{ matrix.service.module }}/target/surefire-reports/
            ${{ matrix.service.module }}/target/failsafe-reports/
          retention-days: 7

  # ==========================================
  # Job 4: Code Quality & Coverage
  # ==========================================
  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run code coverage analysis
        run: ./mvnw -B verify -DskipTests

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/target/site/jacoco/
          retention-days: 7

  # ==========================================
  # Job 5: Summary
  # ==========================================
  summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [build, flyway-migrations, test, code-quality]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flyway Migrations | ${{ needs.flyway-migrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Flyway Version:** ${{ env.FLYWAY_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**PostgreSQL Version:** ${{ env.POSTGRES_VERSION }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: |
          needs.build.result == 'failure' ||
          needs.flyway-migrations.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.code-quality.result == 'failure'
        run: exit 1
