name: Event-Driven Communication CI

on:
    push:
        branches: [main, develop, feature/*]
        paths:
            - "services/notification-service/**"
            - "shared-libs/common-utils/**"
            - "shared-libs/event-models/**"
            - ".github/workflows/event-driven-ci.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "services/notification-service/**"
            - "shared-libs/common-utils/**"
            - "shared-libs/event-models/**"

jobs:
    test-event-models:
        name: Test Event Models
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Test Event Models
              run: |
                  cd shared-libs/event-models
                  mvn clean test -B

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: event-models-test-results
                  path: shared-libs/event-models/target/surefire-reports/

    test-event-publisher:
        name: Test Event Publisher
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Test Common Utils (Event Publisher)
              run: |
                  cd shared-libs/common-utils
                  mvn clean test -B

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: event-publisher-test-results
                  path: shared-libs/common-utils/target/surefire-reports/

    integration-test:
        name: Integration Tests with RabbitMQ & Redis
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: notification_test_db
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

            rabbitmq:
                image: rabbitmq:3.13-management
                env:
                    RABBITMQ_DEFAULT_USER: admin
                    RABBITMQ_DEFAULT_PASS: admin
                options: >-
                    --health-cmd "rabbitmq-diagnostics -q ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5672:5672
                    - 15672:15672

            redis:
                image: redis:7-alpine
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Wait for services
              run: |
                  echo "Waiting for RabbitMQ..."
                  timeout 60 bash -c 'until curl -f -u admin:admin http://localhost:15672/api/overview; do sleep 2; done'
                  echo "Waiting for Redis..."
                  timeout 60 bash -c 'until redis-cli -h localhost ping; do sleep 2; done'
                  echo "All services are ready!"

            - name: Run Integration Tests
              env:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/notification_test_db
                  SPRING_DATASOURCE_USERNAME: postgres
                  SPRING_DATASOURCE_PASSWORD: postgres
                  SPRING_RABBITMQ_HOST: localhost
                  SPRING_RABBITMQ_PORT: 5672
                  SPRING_RABBITMQ_USERNAME: admin
                  SPRING_RABBITMQ_PASSWORD: admin
                  SPRING_DATA_REDIS_HOST: localhost
                  SPRING_DATA_REDIS_PORT: 6379
              run: |
                  mvn clean verify -pl services/notification-service -am -B \
                    -Dspring.profiles.active=test \
                    -Dtest=EventDrivenNotificationIntegrationTest

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: integration-test-results
                  path: services/notification-service/target/surefire-reports/

            - name: Upload Coverage Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: services/notification-service/target/site/jacoco/

    build-notification-service:
        name: Build Notification Service
        runs-on: ubuntu-latest
        needs: [test-event-models, test-event-publisher, integration-test]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Build with Maven
              run: |
                  mvn clean package -pl services/notification-service -am -B -DskipTests

            - name: Upload JAR
              uses: actions/upload-artifact@v4
              with:
                  name: notification-service-jar
                  path: services/notification-service/target/*.jar
                  retention-days: 7

    smoke-test:
        name: Smoke Tests
        runs-on: ubuntu-latest
        needs: [build-notification-service]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Start services with Docker Compose
              working-directory: deployment/docker
              run: |
                  docker-compose up -d postgres rabbitmq redis notification-service

            - name: Wait for Notification Service
              run: |
                  timeout 120 bash -c 'until curl -f http://localhost:8081/actuator/health; do sleep 5; done'

            - name: Test Event Simulator Endpoints
              run: |
                  # Test vehicle booking created event
                  curl -X POST "http://localhost:8081/api/events/simulate/vehicle-booking-created?userId=test-user" \
                    -H "Content-Type: application/json" \
                    --fail-with-body

                  # Test invoice created event
                  curl -X POST "http://localhost:8081/api/events/simulate/invoice-created?userId=test-user" \
                    -H "Content-Type: application/json" \
                    --fail-with-body

                  # Test all events
                  curl -X POST "http://localhost:8081/api/events/simulate/all?userId=test-user" \
                    -H "Content-Type: application/json" \
                    --fail-with-body

            - name: Check RabbitMQ Queues
              run: |
                  # Verify messages were processed
                  curl -u admin:admin http://localhost:15672/api/queues/%2F/notification.queue \
                    --fail-with-body

            - name: Cleanup
              if: always()
              working-directory: deployment/docker
              run: docker-compose down -v
