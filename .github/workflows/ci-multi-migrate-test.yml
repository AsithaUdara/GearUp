name: CI - Migrate all services + integration tests

on:
  push:
    branches: [main, microservice-initialization]
  pull_request:
    branches: [main]

jobs:
  migrate-and-test-all:
    runs-on: ubuntu-latest
    env:
      # Use repo secret or fallback for CI jobs which don't set the secret
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          # Pass the CI job password into the service container
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase service account (if provided)
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret provided; skipping injection"
            exit 0
          fi
          printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > firebase-service-account.json
          chmod 600 firebase-service-account.json
          echo "FIREBASE_CONFIG_PATH=$(pwd)/firebase-service-account.json" >> $GITHUB_ENV

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build and install all modules
        run: ./mvnw -B -U -DskipTests clean install

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 2
          done
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Discover services with Flyway migrations
        id: discover
        run: |
          echo "" > services.txt
          for d in services/*/; do
            svc=$(basename "$d")
            if [ -d "$d/src/main/resources/db/migration" ]; then
              echo "$svc" >> services.txt
            fi
          done
          cat services.txt

      - name: Create DBs and users for discovered services
        run: |
          while read svc; do
            if [ -z "$svc" ]; then continue; fi
            echo "Creating DB and user for $svc"
            dbname=as_${svc}
            dbuser=svc_${svc}
            psql -h localhost -U postgres -c "CREATE USER \"$dbuser\" WITH PASSWORD '${{ env.POSTGRES_PASSWORD }}';" || true
            psql -h localhost -U postgres -c "CREATE DATABASE \"$dbname\" OWNER \"$dbuser\";" || true
          done < services.txt
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Run Flyway migrations for each service
        run: |
          while read svc; do
            if [ -z "$svc" ]; then continue; fi
            echo "Migrating $svc"
            dbname=as_${svc}
            dbuser=svc_${svc}
            ./mvnw "-Dflyway.url=jdbc:postgresql://localhost:5432/${dbname}" "-Dflyway.user=${dbuser}" "-Dflyway.password=${{ env.POSTGRES_PASSWORD }}" -pl services/$svc flyway:migrate
          done < services.txt

      - name: Run integration tests across modules
        run: |
          ./mvnw -DskipTests=false test
