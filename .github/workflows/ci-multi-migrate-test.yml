name: CI - Migrate all services + integration tests

on:
  push:
    branches: [main, development, microservice-initialization]
  pull_request:
    branches: [main, development]

jobs:
  migrate-and-test-all:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          # Pass the CI job password into the service container
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase service account (if provided)
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret provided; skipping injection"
            exit 0
          fi
          printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > firebase-service-account.json
          chmod 600 firebase-service-account.json
          echo "FIREBASE_CONFIG_PATH=$(pwd)/firebase-service-account.json" >> $GITHUB_ENV

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build and install all modules
        run: |
          # Install parent POM first
          ./mvnw -B -DskipTests install -N
          # Install shared libraries
          ./mvnw -B -U -DskipTests clean install -pl shared-libs/security-lib,shared-libs/event-models,shared-libs/common-utils,shared-libs/common-dto -am
          # Build all services
          ./mvnw -B -U -DskipTests clean install

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq postgresql-client

      - name: Wait for Postgres
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Discover services with Flyway migrations
        id: discover
        run: |
          echo "" > services.txt
          for d in services/*/; do
            svc=$(basename "$d")
            if [ -d "$d/src/main/resources/db/migration" ]; then
              echo "$svc" >> services.txt
            fi
          done
          cat services.txt

      - name: Create DBs and users for discovered services
        run: |
          echo "Creating databases and users for discovered services..."
          while read svc; do
            if [ -z "$svc" ]; then continue; fi
            echo "Creating DB and user for $svc"
            # Replace hyphens with underscores for valid PostgreSQL identifiers
            dbname="as_${svc//-/_}"
            dbuser="svc_${svc//-/_}"
            
            # Drop existing database and user if they exist (with quoted identifiers)
            psql -h localhost -U postgres -v ON_ERROR_STOP=0 -c "DROP DATABASE IF EXISTS \"$dbname\";" || true
            psql -h localhost -U postgres -v ON_ERROR_STOP=0 -c "DROP USER IF EXISTS \"$dbuser\";" || true
            
            # Create user (with quoted identifiers)
            psql -h localhost -U postgres -c "CREATE USER \"$dbuser\" WITH PASSWORD '${{ env.POSTGRES_PASSWORD }}';"
            
            # Create database (with quoted identifiers)
            psql -h localhost -U postgres -c "CREATE DATABASE \"$dbname\" OWNER \"$dbuser\";"
            
            # Grant permissions (with quoted identifiers)
            psql -h localhost -U postgres -d "$dbname" -c "GRANT ALL ON SCHEMA public TO \"$dbuser\";"
            psql -h localhost -U postgres -d "$dbname" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO \"$dbuser\";"
            psql -h localhost -U postgres -d "$dbname" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO \"$dbuser\";"
            psql -h localhost -U postgres -d "$dbname" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO \"$dbuser\";"
            
            echo "✓ Database $dbname created successfully"
          done < services.txt
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Run Flyway migrations for each service
        run: |
          echo "Running Flyway migrations for discovered services..."
          while read svc; do
            if [ -z "$svc" ]; then continue; fi
            echo "Migrating $svc..."
            # Replace hyphens with underscores for valid PostgreSQL identifiers
            dbname="as_${svc//-/_}"
            dbuser="svc_${svc//-/_}"
            ./mvnw -B -pl "services/$svc" \
              "-Dflyway.url=jdbc:postgresql://localhost:5432/${dbname}" \
              "-Dflyway.user=postgres" \
              "-Dflyway.password=${{ env.POSTGRES_PASSWORD }}" \
              flyway:migrate
            echo "✓ Migration completed for $svc"
          done < services.txt

      - name: Grant permissions on migrated tables
        run: |
          echo "Granting permissions on all tables to service users..."
          while read svc; do
            if [ -z "$svc" ]; then continue; fi
            echo "Granting permissions for $svc..."
            # Replace hyphens with underscores for valid PostgreSQL identifiers
            dbname="as_${svc//-/_}"
            dbuser="svc_${svc//-/_}"
            
            # Grant permissions on all existing tables, sequences, and functions
            psql -h localhost -U postgres -d "$dbname" -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"$dbuser\";"
            psql -h localhost -U postgres -d "$dbname" -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO \"$dbuser\";"
            psql -h localhost -U postgres -d "$dbname" -c "GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO \"$dbuser\";"
            
            echo "✓ Permissions granted for $svc"
          done < services.txt
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Run integration tests across modules
        env:
          APP_FIREBASE_CONFIGURATION_FILE: ""
          FIREBASE_CONFIG_PATH: ""
          # Pass the same postgres password used for database setup
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Disable Flyway during tests since migrations already ran
          FLYWAY_ENABLED: false
        run: |
          echo "Running integration tests with database password from environment..."
          ./mvnw -B verify
