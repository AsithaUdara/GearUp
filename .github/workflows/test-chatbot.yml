name: Test Chatbot Service

on:
  pull_request:
    branches:
      - main
      - development
      - microservice-initialization
      - chatbot
    paths:
      - "services/chatbot-service/**"
      - "shared-libs/**"
      - ".github/workflows/test-chatbot.yml"
  push:
    branches:
      - development
      - chatbot
    paths:
      - "services/chatbot-service/**"

jobs:
  test-chatbot-service:
    name: Test Chatbot Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          SPRING_DATASOURCE_DB: db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup test database
        env:
          PGPASSWORD: postgres123
        run: |
          psql -h localhost -U postgres <<EOF
          CREATE DATABASE as_chatbot_service;
          CREATE USER svc_chatbot_service WITH PASSWORD 'chatbot_svc_pass_2024';
          GRANT ALL PRIVILEGES ON DATABASE as_chatbot_service TO svc_chatbot_service;
          \c as_chatbot_service
          GRANT ALL ON SCHEMA public TO svc_chatbot_service;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO svc_chatbot_service;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO svc_chatbot_service;
          EOF

      - name: Install shared libraries
        run: |
          ./mvnw -B clean install -DskipTests \
            -pl shared-libs/common-dto,shared-libs/common-utils,shared-libs/event-models,shared-libs/security-lib

      - name: Run Flyway migrations for chatbot-service
        run: |
          ./mvnw -pl services/chatbot-service \
            -Dflyway.url=jdbc:postgresql://localhost:5432/as_chatbot_service \
            -Dflyway.user=postgres \
            -Dflyway.password=postgres123 \
            flyway:migrate

      - name: Run unit tests
        run: |
          ./mvnw -B test -pl services/chatbot-service

      - name: Run integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/as_chatbot_service
          SPRING_DATASOURCE_USERNAME: svc_chatbot_service
          SPRING_DATASOURCE_PASSWORD: chatbot_svc_pass_2024
        run: |
          ./mvnw -B verify -pl services/chatbot-service

      - name: Build chatbot service
        run: |
          ./mvnw -B package -DskipTests -pl services/chatbot-service -am

      - name: Generate test report
        if: always()
        run: |
          echo "Test execution completed"
          if [ -d "services/chatbot-service/target/surefire-reports" ]; then
            echo "Test reports generated at services/chatbot-service/target/surefire-reports"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: services/chatbot-service/target/surefire-reports/
          retention-days: 7

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-service-jar
          path: services/chatbot-service/target/*.jar
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Chatbot Service tests completed" >> $GITHUB_STEP_SUMMARY
