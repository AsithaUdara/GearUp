apiVersion: v1
kind: Service
metadata:
  name: postgres-{{service}}-headless
  labels:
    app: postgres-{{service}}
spec:
  ports:
    - port: 5432
      name: postgres
  clusterIP: None
  selector:
    app: postgres-{{service}}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-{{service}}
  labels:
    app: postgres-{{service}}
spec:
  serviceName: "postgres-{{service}}-headless"
  replicas: 1
  selector:
    matchLabels:
      app: postgres-{{service}}
  template:
    metadata:
      labels:
        app: postgres-{{service}}
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials-{{service}}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials-{{service}}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials-{{service}}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "standard"
        resources:
          requests:
            storage: 10Gi

# Notes:
# - Replace {{service}} with the service short name (e.g. user, trip).
# - For production use a managed DB instead of this StatefulSet.
# - Tweak resources and storageClassName according to your cluster.
