apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials-{{service}}
  labels:
    app: postgres
type: Opaque
stringData:
  # Replace the placeholders for each service
  SPRING_DATASOURCE_DB: "as_{{service}}"
  SPRING_DATASOURCE_USERNAME: "svc_{{service}}"
  SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"

# Usage: replace {{service}} with the service name (e.g., user, trip) and then
# create the secret:
# kubectl apply -f secret-postgres.yml
