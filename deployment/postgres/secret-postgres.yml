apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials-{{service}}
  labels:
    app: postgres
type: Opaque
stringData:
  # Replace the placeholders for each service
  POSTGRES_DB: "as_{{service}}"
  POSTGRES_USER: "svc_{{service}}"
  POSTGRES_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"

# Usage: replace {{service}} with the service name (e.g., user, trip) and then
# create the secret:
# kubectl apply -f secret-postgres.yml
