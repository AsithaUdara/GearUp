services:
  # External entrypoint for the frontend and API consumers
  api-gateway:
    build:
      context: ../../
      dockerfile: ./api-gateway/Dockerfile
    container_name: gearup-api-gateway
    ports:
      - "8088:8080"
    env_file:
      - ../../.env
    environment:
      # Config Server & Eureka service discovery
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:password@service-discovery:8761/eureka
      - EUREKA_URL=http://admin:password@service-discovery:8761/eureka
      - SPRING_CLOUD_CONFIG_FAIL_FAST=false
      # Ensure gateway doesn't try to parse malformed Firebase JSON from .env; fall back to skipping in dev
      - FIREBASE_SERVICE_ACCOUNT_JSON=
    # Redis connection used by gateway filters/rate-limits if enabled
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      service-discovery:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  # Centralized configuration (optionally disabled locally, but useful in container network)
  config-server:
    build:
      context: ../../
      dockerfile: ./config-server/Dockerfile
    container_name: gearup-config-server
    ports:
      - "8888:8888"
    env_file:
      - ../../.env
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:password@service-discovery:8761/eureka
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/app/config-repo
    depends_on:
      service-discovery:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ../../config-repo:/app/config-repo:ro

  # Service discovery (Eureka)
  service-discovery:
    build:
      context: ../../
      dockerfile: ./service-discovery/Dockerfile
    container_name: gearup-service-discovery
    ports:
      - "8761:8761"
    env_file:
      - ../../.env
    environment:
      - SPRING_SECURITY_USER_NAME=admin
      - SPRING_SECURITY_USER_PASSWORD=password
    restart: unless-stopped

  # Automobile microservice (internal only - no host port mapping)
  automobile-service:
    build:
      context: ../../
      dockerfile: ./services/automobile-service/Dockerfile
    container_name: gearup-automobile-service
    env_file:
      - ../../.env
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:password@service-discovery:8761/eureka
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${AUTOMOBILE_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${AUTOMOBILE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTOMOBILE_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    depends_on:
      db:
        condition: service_healthy
      service-discovery:
        condition: service_started
    restart: unless-stopped

  # Notification microservice (internal only)
  notification-service:
    build:
      context: ../../
      dockerfile: ./services/notification-service/Dockerfile
    container_name: gearup-notification-service
    env_file:
      - ../../.env
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:password@service-discovery:8761/eureka
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${NOTIFICATION_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      service-discovery:
        condition: service_started
    restart: unless-stopped

  # User authentication service (internal only)
  user-auth-service:
    build:
      context: ../../
      dockerfile: ./services/user-auth-service/Dockerfile
    container_name: gearup-user-auth-service
    env_file:
      - ../../.env
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:password@service-discovery:8761/eureka
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${USER_AUTH_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${USER_AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${USER_AUTH_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      # RabbitMQ & Redis override localhost defaults in application.yml
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=dev
      - DEV_ADMIN_KEY=${DEV_ADMIN_KEY:-dev-secret}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      service-discovery:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: gearup-postgres
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust  # Allow all connections without password for local dev
      # Pass service passwords to init script
      AUTOMOBILE_DB_PASSWORD: ${AUTOMOBILE_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      USER_AUTH_DB_PASSWORD: ${USER_AUTH_DB_PASSWORD}
      TEMPLATE_DB_PASSWORD: ${TEMPLATE_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gearup-pgadmin
    env_file:
      - ../../.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gearup.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
