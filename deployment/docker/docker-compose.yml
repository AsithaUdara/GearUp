services:
  automobile-service:
    build:
      # Use repository root as build context so the Docker build can access shared modules
      context: ../../
      # Dockerfile for this service, path relative to the build context
      dockerfile: ./services/automobile-service/Dockerfile
    container_name: gearup-automobile-service
    ports:
      - "8080:8080"
    # point env_file to repo root so variables are picked from the top-level .env
    env_file:
      - ../../.env
    environment:
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${AUTOMOBILE_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${AUTOMOBILE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTOMOBILE_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      # Use repository root as build context so the Docker build can access shared modules
      context: ../../
      # Dockerfile for this service, path relative to the build context
      dockerfile: ./services/notification-service/Dockerfile
    container_name: gearup-notification-service
    ports:
      - "8081:8081"
    env_file:
      - ../../.env
    environment:
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${NOTIFICATION_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
    depends_on:
      db:
        condition: service_healthy

  parts-service:
    build:
      context: ../../
      dockerfile: services/parts-service/Dockerfile
    container_name: gearup-parts-service
    ports:
      - "8084:8084"
    env_file:
      - ../../.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/as_parts_service
      - SPRING_DATASOURCE_USERNAME=svc_parts_service
      - SPRING_DATASOURCE_PASSWORD=parts_svc_pass_2024
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      config-server:
        condition: service_started
      service-discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  user-auth-service:
    build:
      context: ../../
      dockerfile: ./services/user-auth-service/Dockerfile
    container_name: gearup-user-auth-service
    ports:
      - "8082:8082"
    env_file:
      - ../../.env
    environment:
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${USER_AUTH_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${USER_AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${USER_AUTH_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    container_name: gearup-postgres
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Pass service passwords to init script
      AUTOMOBILE_DB_PASSWORD: ${AUTOMOBILE_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      USER_AUTH_DB_PASSWORD: ${USER_AUTH_DB_PASSWORD}
      TEMPLATE_DB_PASSWORD: ${TEMPLATE_DB_PASSWORD}
      PARTS_DB_PASSWORD: ${PARTS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gearup-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: rabbitmq-cookie
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gearup-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gearup.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  config-server:
    build:
      context: ../../
      dockerfile: ./config-server/Dockerfile
    container_name: gearup-config-server
    ports:
      - "8888:8888"
    env_file:
      - ../../.env
    environment:
      - CONFIG_REPO_URI=file:/config-repo
      - SPRING_PROFILES_ACTIVE=native
    volumes:
      - ../../config-repo:/config-repo
    restart: unless-stopped

  service-discovery:
    build:
      context: ../../
      dockerfile: ./service-discovery/Dockerfile
    container_name: gearup-service-discovery
    ports:
      - "8761:8761"
    env_file:
      - ../../.env
    depends_on:
      - config-server
    restart: unless-stopped

  api-gateway:
    build:
      context: ../../
      dockerfile: ./api-gateway/Dockerfile
    container_name: gearup-api-gateway
    ports:
      - "9090:9090"
    env_file:
      - ../../.env
    environment:
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
    depends_on:
      - service-discovery
      - config-server
    restart: unless-stopped

volumes:
  db-data:
  rabbitmq-data:
  rabbitmq-log:
