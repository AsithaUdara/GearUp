      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: pgvector/pgvector:pg15
    container_name: gearup-postgres
    env_file:
      - ./.env
    environment:
      # PostgreSQL standard environment variables
      SPRING_DATASOURCE_DB: ${SPRING_DATASOURCE_DB}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust # Allow all connections without password for local dev
      # Pass service passwords to init script
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      USER_AUTH_DB_PASSWORD: ${USER_AUTH_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PARTS_DB_PASSWORD: ${PARTS_DB_PASSWORD}
      CHATBOT_DB_PASSWORD: ${CHATBOT_DB_PASSWORD}
      VEHICLE_DB_PASSWORD: ${VEHICLE_DB_PASSWORD}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD}
      ANALYTICAL_DB_PASSWORD: ${ANALYTICAL_DB_PASSWORD}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
      MODIFICATION_DB_PASSWORD: ${MODIFICATION_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../postgres/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gearup-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gearup.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
  ollama-data:
