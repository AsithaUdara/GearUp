services:
  service-discovery:
    build:
      context: ../../
      dockerfile: ./service-discovery/Dockerfile
    container_name: gearup-service-discovery
    ports:
      - "8761:8761"
    env_file:
      - ./.env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-u",
          "admin:password",
          "http://localhost:8761/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  config-server:
    build:
      context: ../../
      dockerfile: ./config-server/Dockerfile
    container_name: gearup-config-server
    ports:
      - "8888:8888"
    env_file:
      - ./.env
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - CONFIG_REPO_URI=file:/app/config-repo
    volumes:
      - ../../config-repo:/app/config-repo:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-u",
          "configadmin:change-me",
          "http://localhost:8888/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api-gateway:
    build:
      context: ../../
      dockerfile: ./api-gateway/Dockerfile
    container_name: gearup-api-gateway
    ports:
      - "9090:8080"
    env_file:
      - ./.env
    environment:
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      - FIREBASE_CONFIG_PATH=${FIREBASE_CONFIG_PATH}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
    volumes:
      - C:\SecureKeys\gear-up\firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notification-service:
    build:
      # Use repository root as build context so the Docker build can access shared modules
      context: ../../
      # Dockerfile for this service, path relative to the build context
      dockerfile: ./services/notification-service/Dockerfile
    container_name: gearup-notification-service
    ports:
      - "8081:8081"
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=8081
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - FIREBASE_CONFIG_PATH=${FIREBASE_CONFIG_PATH}
      - APP_FIREBASE_CONFIGURATION_FILE=/app/secrets/firebase-service-account.json
      - SPRING_DATASOURCE_URL=${NOTIFICATION_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      # In dev, auto-create missing tables to avoid schema-validation failures
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    volumes:
      - C:\SecureKeys\gear-up\firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
