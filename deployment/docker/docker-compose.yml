services:
  service-discovery:
    build:
      context: ../../
      dockerfile: ./service-discovery/Dockerfile
    container_name: gearup-service-discovery
    ports:
      - "8761:8761"
    env_file: [ ./.env ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  config-server:
    build:
      context: ../../
      dockerfile: ./config-server/Dockerfile
    container_name: gearup-config-server
    ports:
      - "8888:8888"
    env_file: [ ./.env ]
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_URI: file:/app/config-repo
    volumes:
      - ../../config-repo:/app/config-repo:ro
    restart: unless-stopped
    depends_on:
      - service-discovery
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gearup-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7
    container_name: gearup-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  payment-service:
    build:
      context: ../../
      dockerfile: ./services/payment-service/Dockerfile
    container_name: gearup-payment-service
    ports:
      - "8083:8083"
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=${PAYMENT_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${PAYMENT_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PAYMENT_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_DEFAULT_ZONE}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  parts-service:
    build:
      context: ../../
      dockerfile: ./services/parts-service/Dockerfile
    container_name: gearup-parts-service
    ports:
      - "8093:8093"
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=8093
      - SPRING_DATASOURCE_URL=${PARTS_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${PARTS_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PARTS_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_DEFAULT_ZONE}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  appointment-service:
    build:
      context: ../../
      dockerfile: ./services/appointment-service/Dockerfile
    container_name: gearup-appointment-service
    ports:
      - "8084:8084"
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=${APPOINTMENT_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${APPOINTMENT_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${APPOINTMENT_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_DEFAULT_ZONE}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  modification-service:
    build:
      context: ../../
      dockerfile: ./services/modification-service/Dockerfile
    container_name: gearup-modification-service
    ports:
      - "8089:8089"
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=8089
      - SPRING_DATASOURCE_URL=${MODIFICATION_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${MODIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${MODIFICATION_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_DEFAULT_ZONE}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: pgvector/pgvector:pg15
    container_name: gearup-postgres
    env_file: [ ./.env ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
      AUTOMOBILE_DB_PASSWORD: ${AUTOMOBILE_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      USER_AUTH_DB_PASSWORD: ${USER_AUTH_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PARTS_DB_PASSWORD: ${PARTS_DB_PASSWORD}
      CHATBOT_DB_PASSWORD: ${CHATBOT_DB_PASSWORD}
      VEHICLE_DB_PASSWORD: ${VEHICLE_DB_PASSWORD}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD}
      ANALYTICAL_DB_PASSWORD: ${ANALYTICAL_DB_PASSWORD}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
      MODIFICATION_DB_PASSWORD: ${MODIFICATION_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../postgres/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build:
      context: ../../
      dockerfile: ./api-gateway/Dockerfile
    container_name: gearup-api-gateway
    ports:
      - "8080:8080"
    env_file: [ ./.env ]
    environment:
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: configadmin
      SPRING_CLOUD_CONFIG_PASSWORD: change-me
      # Ensure gateway talks to Eureka inside the Docker network (not localhost)
      EUREKA_URL: http://admin:password@service-discovery:8761/eureka
      EUREKA_DEFAULT_ZONE: http://admin:password@service-discovery:8761/eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:password@service-discovery:8761/eureka
      # Force gateway to use mounted service account file (avoid JSON-in-env PKCS#8 issues)
      FIREBASE_CONFIG_PATH: /app/secrets/firebase-service-account.json
    volumes:
      - "C:/SecureKeys/gear-up/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro"
    depends_on:
      - service-discovery
      - config-server
      - rabbitmq
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  template-service:
    build:
      context: ../../
      dockerfile: ./services/template-service/Dockerfile
    container_name: gearup-template-service
    env_file: [ ./.env ]
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: configadmin
      SPRING_CLOUD_CONFIG_PASSWORD: change-me
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      # Provide both env names some modules/templates expect; include credentials for secured Eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:password@service-discovery:8761/eureka
      EUREKA_DEFAULT_ZONE: http://admin:password@service-discovery:8761/eureka
      SPRING_DATASOURCE_URL: ${TEMPLATE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${TEMPLATE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${TEMPLATE_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_REDIS_PORT}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      # Firebase (optional for direct token verification, kept for future use)
      FIREBASE_CONFIG_PATH: /app/secrets/firebase-service-account.json
    ports:
      - "8090:8090"
    depends_on:
      - db
      - service-discovery
      - config-server
      - rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  user-auth-service:
    build:
      context: ../../
      dockerfile: ./services/user-auth-service/Dockerfile
    container_name: gearup-user-auth-service
    env_file: [ ./.env ]
    environment:
      SERVER_PORT: 8082
      # Force user-auth-service to use mounted service account file
      FIREBASE_CONFIG_PATH: /app/secrets/firebase-service-account.json
      APP_FIREBASE_CONFIGURATION_FILE: /app/secrets/firebase-service-account.json
      SPRING_DATASOURCE_URL: ${USER_AUTH_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${USER_AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_AUTH_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATA_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_REDIS_PORT}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: configadmin
      SPRING_CLOUD_CONFIG_PASSWORD: change-me
      # Explicit Eureka URL (previous env var was blank causing registration failure)
      # Add credentials for secured Eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:password@service-discovery:8761/eureka
      EUREKA_DEFAULT_ZONE: http://admin:password@service-discovery:8761/eureka
    volumes:
      - "C:/SecureKeys/gear-up/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro"
    depends_on:
      - service-discovery
      - config-server
      - db
      - rabbitmq
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gearup-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gearup.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
