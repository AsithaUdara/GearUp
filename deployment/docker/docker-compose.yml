services:
  automobile-service:
    build:
      # Use repository root as build context so the Docker build can access shared modules
      context: ../../
      # Dockerfile for this service, path relative to the build context
      dockerfile: ./services/automobile-service/Dockerfile
    container_name: gearup-automobile-service
    ports:
      - "8080:8080"
    # point env_file to repo root so variables are picked from the top-level .env
    env_file:
      - ../../.env
    environment:
      - APP_FIREBASE_CONFIGURATION_FILE=file:${FIREBASE_CREDENTIALS_CONTAINER_PATH:-/run/secrets/firebase-service-account.json}
      - SPRING_DATASOURCE_URL=${AUTOMOBILE_DB_URL:-jdbc:postgresql://db:5432/as_automobile_service}
      - SPRING_DATASOURCE_USERNAME=${AUTOMOBILE_DB_USER:-svc_automobile_service}
      - SPRING_DATASOURCE_PASSWORD=${AUTOMOBILE_DB_PASSWORD:-auto_svc_pass_2024}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      # Use repository root as build context so the Docker build can access shared modules
      context: ../../
      # Dockerfile for this service, path relative to the build context
      dockerfile: ./services/notification-service/Dockerfile
    container_name: gearup-notification-service
    ports:
      - "8081:8081"
    env_file:
      - ../../.env
    environment:
      - APP_FIREBASE_CONFIGURATION_FILE=file:${FIREBASE_CREDENTIALS_CONTAINER_PATH:-/run/secrets/firebase-service-account.json}
      - SPRING_DATASOURCE_URL=${NOTIFICATION_DB_URL:-jdbc:postgresql://db:5432/as_notification_service}
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USER:-svc_notification_service}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD:-notif_svc_pass_2024}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  user-auth-service:
    build:
      context: ../../
      dockerfile: ./services/user-auth-service/Dockerfile
    container_name: gearup-user-auth-service
    ports:
      - "8082:8082"
    env_file:
      - ../../.env
    environment:
      - APP_FIREBASE_CONFIGURATION_FILE=file:${FIREBASE_CREDENTIALS_CONTAINER_PATH:-/run/secrets/firebase-service-account.json}
      - SPRING_DATASOURCE_URL=${USER_AUTH_DB_URL:-jdbc:postgresql://db:5432/as_user_auth_service}
      - SPRING_DATASOURCE_USERNAME=${USER_AUTH_DB_USER:-svc_user_auth_service}
      - SPRING_DATASOURCE_PASSWORD=${USER_AUTH_DB_PASSWORD:-auth_svc_pass_2024}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: gearup-postgres
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db-data:
