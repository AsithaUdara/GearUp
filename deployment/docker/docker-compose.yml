services:
  automobile-service:
    build:
      # Use repository root as build context so the Docker build can access shared modules
      context: ../../
      # Dockerfile for this service, path relative to the build context
      dockerfile: ./services/automobile-service/Dockerfile
    container_name: gearup-automobile-service
    ports:
      - "8080:8080"
    # point env_file to repo root so variables are picked from the top-level .env
    env_file:
      - ../../.env
    environment:
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${AUTOMOBILE_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${AUTOMOBILE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTOMOBILE_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      # Use repository root as build context so the Docker build can access shared modules
      context: ../../
      # Dockerfile for this service, path relative to the build context
      dockerfile: ./services/notification-service/Dockerfile
    container_name: gearup-notification-service
    ports:
      - "8081:8081"
    env_file:
      - ../../.env
    environment:
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${NOTIFICATION_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  user-auth-service:
    build:
      context: ../../
      dockerfile: ./services/user-auth-service/Dockerfile
    container_name: gearup-user-auth-service
    ports:
      - "8082:8082"
    env_file:
      - ../../.env
    environment:
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${USER_AUTH_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${USER_AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${USER_AUTH_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tracking-service:
    build:
      context: ../../
      dockerfile: ./services/tracking-service/Dockerfile
    container_name: gearup-tracking-service
    ports:
      - "8086:8086"
    env_file:
      - ../../.env
    environment:
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - SPRING_DATASOURCE_URL=${TRACKING_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${TRACKING_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${TRACKING_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  analytical-service:
    build:
      context: ../../
      dockerfile: ./services/analytical-service/Dockerfile
    container_name: gearup-analytical-service
    ports:
      - "8087:8087"
    env_file:
      - ../../.env
    environment:
      - SPRING_DATASOURCE_URL=${ANALYTICAL_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${ANALYTICAL_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${ANALYTICAL_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: gearup-postgres
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust  # Allow all connections without password for local dev
      # Pass service passwords to init script
      AUTOMOBILE_DB_PASSWORD: ${AUTOMOBILE_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      USER_AUTH_DB_PASSWORD: ${USER_AUTH_DB_PASSWORD}
      TEMPLATE_DB_PASSWORD: ${TEMPLATE_DB_PASSWORD}
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD}
      ANALYTICAL_DB_PASSWORD: ${ANALYTICAL_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gearup-pgadmin
    env_file:
      - ../../.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gearup.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
