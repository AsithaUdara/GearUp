        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  payment-service:
    build:
      context: ../../
      dockerfile: ./services/payment-service/Dockerfile
    container_name: gearup-payment-service
    ports:
      - "8083:8083"
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=${PAYMENT_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${PAYMENT_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PAYMENT_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_DEFAULT_ZONE}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  parts-service:
    build:
      context: ../../
      dockerfile: ./services/parts-service/Dockerfile
    container_name: gearup-parts-service
    ports:
      - "8093:8093"
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=8093
      - SPRING_DATASOURCE_URL=${PARTS_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${PARTS_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PARTS_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_DEFAULT_ZONE}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  appointment-service:
    build:
      context: ../../
      dockerfile: ./services/appointment-service/Dockerfile
    container_name: gearup-appointment-service
    ports:
      - "8084:8084"
    env_file:
      - ../../.env
    environment:
      - SPRING_DATASOURCE_URL=${APPOINTMENT_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${APPOINTMENT_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${APPOINTMENT_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  modification-service:
    build:
      context: ../../
      dockerfile: ./services/modification-service/Dockerfile
    container_name: gearup-modification-service
    ports:
      - "8089:8089"
    env_file:
      - ../../.env
    environment:
      - SPRING_DATASOURCE_URL=${MODIFICATION_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${MODIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${MODIFICATION_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SERVER_PORT=8089
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: gearup-postgres
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Pass service passwords to init script
      AUTOMOBILE_DB_PASSWORD: ${AUTOMOBILE_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      USER_AUTH_DB_PASSWORD: ${USER_AUTH_DB_PASSWORD}
      TEMPLATE_DB_PASSWORD: ${TEMPLATE_DB_PASSWORD}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD}
      MODIFICATION_DB_PASSWORD: ${MODIFICATION_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gearup-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gearup.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
