version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - parts-network

  parts-service:
    build:
      context: ../../services/parts-service
      dockerfile: Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=${PARTS_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${PARTS_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PARTS_DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parts-network

  parts-service-db-init:
    image: postgres:15
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      bash -c "
        psql -h db -U postgres -d postgres -c \"CREATE DATABASE as_parts_service;\" &&
        psql -h db -U postgres -d as_parts_service -c \"CREATE USER svc_parts_service WITH PASSWORD 'postgres';\" &&
        psql -h db -U postgres -d as_parts_service -c \"GRANT ALL PRIVILEGES ON DATABASE as_parts_service TO svc_parts_service;\" &&
        psql -h db -U postgres -d as_parts_service -c \"ALTER USER svc_parts_service WITH SUPERUSER;\"
      "
    networks:
      - parts-network

volumes:
  postgres_data:
    driver: local

networks:
  parts-network:
    driver: bridge