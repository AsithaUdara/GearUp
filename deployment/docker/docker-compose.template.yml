# Optional profile override for local development of template-service only.
# Usage example:
#   docker compose -f deployment/docker/docker-compose.yml -f deployment/docker/docker-compose.template.yml --profile template up -d template-service
# This file does NOT modify or remove existing services in the base compose.
# Host port 8091 chosen to avoid conflict with vehicle-service (8090).
version: "3.9"
services:
  # When this override file is included, user-auth-service will only start if the
  # 'template' profile is explicitly enabled. Without this file, base behavior is unchanged.
  user-auth-service:
    profiles: ["template"]
    environment:
      - DEV_ADMIN_KEY=${DEV_ADMIN_KEY:-dev-secret}

  template-service:
    profiles: ["template"]
    build:
      context: ../../
      dockerfile: ./services/template-service/Dockerfile
    container_name: gearup-template-service
    ports:
      - "8091:8090"  # external:internal
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=8090
      - SPRING_DATASOURCE_URL=${TEMPLATE_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${TEMPLATE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${TEMPLATE_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_USERNAME=configadmin
      - SPRING_CLOUD_CONFIG_PASSWORD=change-me
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_DEFAULT_ZONE}
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
