spring:
  application:
    name: vehicle-service
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}

datasource:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/vehicles}
  username: ${DB_USER:}
  password: ${DB_PASSWORD:}

 

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
