spring:
  application:
    name: vehicle-service

datasource:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/vehicles}
  username: ${DB_USER:}
  password: ${DB_PASSWORD:}

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
