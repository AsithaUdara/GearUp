spring:
  application:
    name: notification-service

messaging:
  smtp:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}

rabbitmq:
  host: ${RABBIT_HOST:localhost}
  exchange: ${RABBIT_EXCHANGE:notifications}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
