spring:
  application:
    name: user-auth-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/as_user_auth_service}
    username: ${SPRING_DATASOURCE_USERNAME:svc_user_auth_service}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_svc_pass_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
  
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
    timeout: 60000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

# Firebase Configuration
app:
  firebase-configuration-file: ${APP_FIREBASE_CONFIGURATION_FILE:classpath:firebase-service-account.json}

# JWT Configuration (for internal service-to-service communication)
jwt:
  secret: ${JWT_SECRET:gearup-super-secret-key-change-this-in-production-must-be-256-bits-long}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

# Security Configuration
security:
  public-endpoints:
    - /actuator/health
    - /actuator/info
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/auth/verify-token

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gearup: DEBUG
    org.springframework.security: DEBUG
