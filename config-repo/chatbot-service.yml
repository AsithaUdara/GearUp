# Chatbot Service Configuration
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/as_chatbot_service}
    username: ${SPRING_DATASOURCE_USERNAME:svc_chatbot_service}
    password: ${SPRING_DATASOURCE_PASSWORD:chatbot_svc_pass_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2.0

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  # Cache configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour in milliseconds

# Ollama Configuration
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat-model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  timeout: 120000
  max-retries: 3
  parameters:
    temperature: 0.3            # Lower = more focused responses (0.0-1.0)
    top-p: 0.7                  # Nucleus sampling threshold
    top-k: 20                   # Vocabulary selection limit
    max-tokens: 200             # Maximum response length in tokens
    repeat-penalty: 1.2         # Penalty for repetition

# Chatbot Configuration
chatbot:
  rag:
    enabled: true
    top-k: 3
    similarity-threshold: 0.7
  session:
    max-active-per-user: 5
    timeout-hours: 24
  knowledge-base:
    auto-load: true
  response:
    max-length: 500             # Maximum response length in characters
    max-sentences: 5            # Maximum number of sentences
    remove-filler-words: true   # Remove unnecessary filler phrases

# WebSocket Configuration
websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Logging
logging:
  level:
    com.gearup.chatbotservice: DEBUG
    org.springframework.web: INFO
    org.springframework.messaging: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management and Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8086

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://admin:password@service-discovery:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
