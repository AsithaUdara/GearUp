spring:
  application:
    name: api-gateway
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
  
  cloud:
    gateway:
      routes:
        # Chatbot Service - Public Access (No Authentication Required)
        - id: chatbot-service
          uri: lb://chatbot-service
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=0
        
        # Chatbot Service V1 API - Public Access
        - id: chatbot-service-v1
          uri: lb://chatbot-service
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=0
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600

server:
  port: ${PORT:8080}

# Eureka client placeholder
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

# Messaging / persistence placeholders (use central spring.* defaults)
messaging:
  rabbitmq:
    exchange: ${RABBIT_EXCHANGE:gateway-exchange}
