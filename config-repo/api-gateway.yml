spring:
  application:
    name: api-gateway

server:
  port: ${PORT:8080}

# Eureka client placeholder
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

# Messaging / persistence placeholders
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

rabbitmq:
  host: ${RABBIT_HOST:localhost}
  exchange: ${RABBIT_EXCHANGE:gateway-exchange}
