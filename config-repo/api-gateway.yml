spring:
  application:
    name: api-gateway
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
  
  cloud:
    gateway:
      routes:
        # Chatbot Service - Public Access (No Authentication Required)
        - id: chatbot-service
          uri: lb://chatbot-service
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=0

        # User Auth Service - Authentication endpoints (public for login/register/refresh as defined in service security config)
        - id: user-auth-service-auth
          uri: lb://user-auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # User Auth Service - User profile & registration endpoints (secured except /register handled inside service)
        - id: user-auth-service-users
          uri: lb://user-auth-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0

        # User Auth Service - Admin user management endpoints
        - id: user-auth-service-admin-users
          uri: lb://user-auth-service
          predicates:
            - Path=/api/v1/admin/users/**
          filters:
            - StripPrefix=0

        # Template Service - Admin template CRUD endpoints
        - id: template-service-admin
          uri: lb://template-service
          predicates:
            - Path=/api/v1/admin/service-templates/**
          filters:
            - StripPrefix=0
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600

server:
  port: ${PORT:8080}

# Eureka client placeholder
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

# Messaging / persistence placeholders (use central spring.* defaults)
messaging:
  rabbitmq:
    exchange: ${RABBIT_EXCHANGE:gateway-exchange}
