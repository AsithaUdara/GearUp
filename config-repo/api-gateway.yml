spring:
  application:
    name: api-gateway
  redis:
    host: ${SPRING_DATA_REDIS_HOST:redis}
    port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
  
  cloud:
    gateway:
      routes:
        # ========================================
        # User Auth Service - v1 API
        # ========================================
        - id: user-auth-service
          uri: lb://user-auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/roles/**, /api/v1/admin/users/**
          filters:
            - StripPrefix=0
        
        # ========================================
        # Chatbot Service - v1 API (Public Access)
        # ========================================
        - id: chatbot-service
          uri: lb://chatbot-service
          predicates:
            - Path=/api/v1/chat/**, /api/v1/hello
          filters:
            - StripPrefix=0
        
        # ========================================
        # Vehicle Service - v1 API
        # ========================================
        - id: vehicle-service
          uri: lb://vehicle-service
          predicates:
            - Path=/api/v1/vehicles/**
          filters:
            - StripPrefix=0
        
        # ========================================
        # Customer Service - v1 API
        # ========================================
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - StripPrefix=0
        
        # ========================================
        # Appointment Service - v1 API
        # ========================================
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/services/**, /api/v1/employees/**, /api/v1/timeslots/**, /api/v1/bookings/**
          filters:
            - StripPrefix=0
        
        # ========================================
        # Payment Service - v1 API
        # ========================================
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**, /api/v1/reviews/**
          filters:
            - StripPrefix=0
        
        # ========================================
        # Tracking Service - v1 API
        # ========================================
        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/v1/tracking/**
          filters:
            - StripPrefix=0
        
        # ========================================
        # Modification Service - v1 API
        # ========================================
        - id: modification-service
          uri: lb://modification-service
          predicates:
            - Path=/api/v1/service-modifications/**, /api/v1/modification-requests/**, /api/v1/customers/**
          filters:
            - StripPrefix=0
        
        # ========================================
        # Notification Service - v1 API
        # ========================================
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/test/**
          filters:
            - StripPrefix=0
        
        # ========================================
        # Analytical Service - v1 API
        # ========================================
        - id: analytical-service
          uri: lb://analytical-service
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - StripPrefix=0
        
        # ========================================
        # Parts Service - v1 API
        # ========================================
        - id: parts-service
          uri: lb://parts-service
          predicates:
            - Path=/api/v1/parts-requests/**
          filters:
            - StripPrefix=0
        
        # User Auth Service - Authentication endpoints (public for login/register/refresh as defined in service security config)
        - id: user-auth-service-auth
          uri: lb://user-auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # User Auth Service - User profile & registration endpoints (secured except /register handled inside service)
        - id: user-auth-service-users
          uri: lb://user-auth-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0

        # User Auth Service - Admin user management endpoints
        - id: user-auth-service-admin-users
          uri: lb://user-auth-service
          predicates:
            - Path=/api/v1/admin/users/**
          filters:
            - StripPrefix=0

        # Template Service - Admin template CRUD endpoints
        - id: template-service-admin
          uri: lb://template-service
          predicates:
            - Path=/api/v1/admin/service-templates/**
          filters:
            - StripPrefix=0
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600

server:
  port: ${PORT:8080}

# Eureka client placeholder
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

# Messaging / persistence placeholders (use central spring.* defaults)
messaging:
  rabbitmq:
    exchange: ${RABBIT_EXCHANGE:gateway-exchange}
    