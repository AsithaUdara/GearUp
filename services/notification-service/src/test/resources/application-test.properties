# Test Configuration for notification-service

# Disable DataSource auto-configuration for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Firebase configuration (use classpath resource or leave empty for tests)
app.firebase-configuration-file=

# Database configuration (not used in unit tests but defined to prevent errors)
spring.datasource.url=jdbc:postgresql://localhost:5432/as_notification_service
spring.datasource.username=svc_notification_service
spring.datasource.password=${POSTGRES_PASSWORD:test}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

# Disable RabbitMQ for unit tests
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Disable Redis for unit tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# WebSocket configuration
websocket.allowed-origins=http://localhost:3000
