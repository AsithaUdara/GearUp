# Application Name
spring.application.name=notification-service

# Server Port
server.port=8081

# PostgreSQL Configuration - default to Compose service 'db' when env missing
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/notification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configuration - use Compose service names as safe defaults when running in Docker
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Redis Configuration - default to Compose service name
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Firebase Configuration
app.firebase-configuration-file=${APP_FIREBASE_CONFIGURATION_FILE}

# Logging
logging.level.com.gearup.notificationservice=DEBUG
logging.level.org.springframework.amqp=DEBUG
