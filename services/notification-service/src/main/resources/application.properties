# Application Name
spring.application.name=notification-service

# Server Port
server.port=8081

# PostgreSQL Configuration - default to Compose service 'db' when env missing
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/as_notification_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:svc_notification_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:notif_svc_pass_2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# RabbitMQ Configuration - use Compose service names as safe defaults when running in Docker
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Redis Configuration - default to Compose service name
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Firebase Configuration
app.firebase-configuration-file=${APP_FIREBASE_CONFIGURATION_FILE}

# Logging
logging.level.com.gearup.notificationservice=DEBUG
logging.level.org.springframework.amqp=DEBUG
