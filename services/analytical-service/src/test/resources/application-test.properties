# Test Configuration for Analytical Service
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests
spring.flyway.enabled=false

# Disable Config Server for tests
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

# Disable Eureka for tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Completely disable Redis 
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.data.redis.repositories.enabled=false
spring.cache.type=none

# Completely disable RabbitMQ
spring.rabbitmq.listener.simple.auto-startup=false

# Allow bean definition overriding to allow test mocks to override shared library beans
spring.main.allow-bean-definition-overriding=true

# Logging
logging.level.com.gearup.analyticalservice=DEBUG
