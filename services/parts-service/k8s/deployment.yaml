apiVersion: apps/v1
kind: Deployment
metadata:
  name: parts-service
  namespace: gearup
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parts-service
  template:
    metadata:
      labels:
        app: parts-service
    spec:
      containers:
      - name: parts-service
        image: gearup/parts-service:latest
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: PARTS_DB_URL
          value: "parts-db-service:5432"
        - name: PARTS_DB_NAME
          value: "parts_db"
        - name: PARTS_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: parts-service-secrets
              key: PARTS_DB_USERNAME
        - name: PARTS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: parts-service-secrets
              key: PARTS_DB_PASSWORD
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: config-volume
          mountPath: /config
      volumes:
      - name: config-volume
        configMap:
          name: parts-service-config