apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: parts-service-network-policy
  namespace: gearup
spec:
  podSelector:
    matchLabels:
      app: parts-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: gearup
    ports:
    - protocol: TCP
      port: 8082
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: parts-db
    ports:
    - protocol: TCP
      port: 5432