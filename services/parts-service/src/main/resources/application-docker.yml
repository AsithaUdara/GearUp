spring:
  datasource:
    url: jdbc:postgresql://parts-db:5432/parts_db
    username: parts_user
    password: parts_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082