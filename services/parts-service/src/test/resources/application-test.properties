# Test Configuration
spring.application.name=parts-service

# Allow bean definition overriding for test mocks
spring.main.allow-bean-definition-overriding=true

# H2 In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests (using JPA to create schema)
spring.flyway.enabled=false

# Disable Config Server for tests
spring.cloud.config.enabled=false

# RabbitMQ Configuration (will be mocked)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Redis Configuration (will be mocked)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Disable Eureka for tests
eureka.client.enabled=false

# Logging
logging.level.com.gearup.partsservice=DEBUG
logging.level.org.springframework.test=INFO
