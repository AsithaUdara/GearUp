spring:
  application:
    name: template-service
  config:
    # Use in-cluster service name directly so we don't depend on an env var mismatch
    # (previously referenced SPRING_CLOUD_CONFIG_URI which was not set, falling back to localhost)
    import: "optional:configserver:http://config-server:8888"

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Hard override to ensure proper Eureka registration inside Docker network
eureka:
  client:
    # Provide both kebab-case and camelCase variants to be safe across different binders
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:${EUREKA_DEFAULT_ZONE:http://admin:password@service-discovery:8761/eureka/}}}
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:${EUREKA_DEFAULT_ZONE:http://admin:password@service-discovery:8761/eureka/}}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Eureka client configuration comes from Config Server (global application.yml) and/or
# the EUREKA_DEFAULT_ZONE / EUREKA_CLIENT_SERVICEURL_DEFAULTZONE env vars supplied via docker-compose.
# Datasource, RabbitMQ, Redis, etc. are provided via environment variables in docker-compose.yml
