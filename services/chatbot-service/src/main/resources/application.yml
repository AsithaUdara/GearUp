spring:
  application:
    name: chatbot-service

  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}

server:
  port: 8084

eureka:
  client:
    service-url:
      default-zone: http://admin:password@service-discovery:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
