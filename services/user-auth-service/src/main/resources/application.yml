spring:
  application:
    name: user-auth-service

  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"

  cloud:
    config:
      enabled: false # Disabled for local development
      fail-fast: false
      uri: http://localhost:8888

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/as_user_auth_service}
    username: ${SPRING_DATASOURCE_USERNAME:svc_user_auth_service}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_svc_pass_2024}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: true # Re-enabled for local PostgreSQL 18
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 60000

  # RabbitMQ Configuration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        missing-queues-fatal: false

server:
  port: 8082

# Firebase Configuration
app:
  firebase-configuration-file: C:/SecureKeys/gear-up/firebase-service-account.json

# JWT Configuration
jwt:
  secret: your-256-bit-secret-key-change-this-in-production-environment-make-it-secure
  expiration: 3600000 # 1 hour in milliseconds
  refresh-expiration: 2592000000 # 30 days in milliseconds

# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://admin:password@localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Logging
logging:
  level:
    root: INFO
    com.gearup: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
