# Template DB configuration for user-auth service
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/as_user
    username: ${DB_USER:svc_user}
    password: ${DB_PASSWORD:changeme}
  flyway:
    enabled: true
    locations: classpath:db/migration
# Override these via environment variables or Kubernetes secrets in production
