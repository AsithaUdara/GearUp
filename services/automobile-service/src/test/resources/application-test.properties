# Test Configuration for automobile-service

# Disable DataSource auto-configuration for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Firebase configuration (use classpath resource or leave empty for tests)
app.firebase-configuration-file=

# Database configuration (not used in unit tests but defined to prevent errors)
spring.datasource.url=jdbc:postgresql://localhost:5432/test_automobile_db
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
