apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: gearup
  labels:
    app: tracking-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
        tier: backend
    spec:
      containers:
      - name: tracking-service
        image: gearup/tracking-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8091
          name: http
          protocol: TCP
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: tracking-service-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: tracking-service-config
              key: POSTGRES_PORT
        - name: SPRING_DATASOURCE_DB
          valueFrom:
            configMapKeyRef:
              name: tracking-service-config
              key: SPRING_DATASOURCE_DB
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-service:5432/as_tracking_service
        - name: SPRING_DATASOURCE_USERNAME
          value: "svc_tracking_service"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: tracking-db-password
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: tracking-service-config
              key: SERVER_PORT
        - name: EUREKA_ENABLED
          valueFrom:
            configMapKeyRef:
              name: tracking-service-config
              key: EUREKA_ENABLED
        - name: EUREKA_SERVER
          valueFrom:
            configMapKeyRef:
              name: tracking-service-config
              key: EUREKA_SERVER
        - name: SPRING_CLOUD_CONFIG_URI
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: SPRING_CLOUD_CONFIG_URI
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: SPRING_RABBITMQ_HOST
        - name: SPRING_RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: SPRING_RABBITMQ_PORT
        - name: SPRING_RABBITMQ_USERNAME
          value: "guest"
        - name: SPRING_RABBITMQ_PASSWORD
          value: "guest"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8091
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8091
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tracking-service-hpa
  namespace: gearup
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tracking-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
