# Development Profile Configuration
server.port=8089

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ms_modification_service
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:svc_modification_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mod_svc_pass_2024}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Jackson JSON Configuration
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway
spring.flyway.enabled=false

# Logging
logging.level.com.gearup.modificationservice=DEBUG
logging.level.org.springframework.web=DEBUG
