spring:
  autoconfigure:
    exclude:
      # Exclude management reactive security so actuator isn't separately secured
      - org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      # Global CORS configuration (applies to all routes)
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
            # Pattern support (Spring 5.3+/Spring Cloud 2022+) for any localhost port
            allowedOriginPatterns:
              - "http://localhost:*"
            # In some Spring Cloud Gateway versions a scalar '*' for allowedHeaders may not be
            # interpreted correctly for credentialed requests. Make the list explicit so that
            # preflight (OPTIONS) for Authorization + Content-Type + custom headers succeeds.
            # NOTE: Keep this list broad but explicit; wildcard + allowCredentials is disallowed
            # by browsers, so enumerating solves the missing Access-Control-Allow-Origin header issue.
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
              - Access-Control-Request-Method
              - Access-Control-Request-Headers
              - Cache-Control
              - Pragma
              - Expires
              - Referer
              - User-Agent
              - X-Actuator-Token
            exposedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
            maxAge: 3600
      default-filters: []
      routes:
        # Route for auth endpoints (login, OTP verification, password change)
        - id: user-auth-service-auth
          uri: http://user-auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
        # Route for admin user management endpoints
        - id: user-auth-service-admin
          uri: http://user-auth-service:8081
          predicates:
            - Path=/api/v1/admin/**
        # (Optional) Route for other user related endpoints if needed
        - id: user-auth-service-users
          uri: http://user-auth-service:8081
          predicates:
            - Path=/api/v1/users/**
        # Dev-only helper endpoints for local E2E
        - id: user-auth-service-dev
          uri: http://user-auth-service:8081
          predicates:
            - Path=/api/v1/dev/**
        # Root API passthrough to gateway itself if required
        - id: api-gateway-root
          uri: lb://api-gateway
          predicates:
            - Path=/api/**
          filters:
            - name: StripPrefix
              args:
                parts: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://admin:password@localhost:8761/eureka/}

server:
  port: ${GATEWAY_PORT:8080}

# Actuator
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  metrics:
    enable:
      all: false
  health:
    redis:
      enabled: false
    diskspace:
      enabled: true
    ping:
      enabled: true

# CORS and Redis config are defined under the single 'spring' mapping above

# Resilience (Resilience4j) settings
resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 100
        failureRateThreshold: 50

# Gateway default filters: timeout/retry are applied per-route or globally as needed

# Security: Firebase credentials should be provided to services via env or k8s secrets
firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
