spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            # Chatbot Service Route - Public Access (No Authentication)
            - id: chatbot-service-route
              uri: lb://chatbot-service
              predicates:
                - Path=/api/v1/chat/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Don't strip prefix, chatbot service expects /api/v1/chat
            # Chatbot Test Endpoint Route
            - id: chatbot-test-route
              uri: lb://chatbot-service
              predicates:
                - Path=/api/v1/hello
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path

            # User Auth Service Routes
            - id: user-auth-auth-route
              uri: lb://user-auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path as auth service expects /api/v1/auth
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            - id: user-auth-users-route
              uri: lb://user-auth-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path as user service expects /api/v1/users
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            - id: user-auth-admin-users-route
              uri: lb://user-auth-service
              predicates:
                - Path=/api/v1/admin/users/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path: admin controller expects /api/v1/admin/users
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            # Vehicle Service Route
            - id: vehicle-service-route
              uri: lb://vehicle-service
              predicates:
                - Path=/api/v1/vehicles/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path as vehicle service expects /api/v1/vehicles

            # Customer Service Route
            - id: customer-service-route
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path as customer service expects /api/v1/customers

            # Analytical Service Route
            - id: analytical-service-route
              uri: lb://analytical-service
              predicates:
                - Path=/api/v1/analytics/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path

            # Tracking Service Route
            - id: tracking-service-route
              uri: lb://tracking-service
              predicates:
                - Path=/api/v1/tracking/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40

            # Payment Service Route
            - id: payment-service-route
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**,/api/v1/bills/**,/api/v1/payment-requests/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path as payment service expects /api/v1/payments
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 15
                    redis-rate-limiter.burstCapacity: 30

            # Parts Service Route
            - id: parts-service-route
              uri: lb://parts-service
              predicates:
                - Path=/api/v1/parts/**,/api/v1/parts-requests/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path as parts service expects /api/parts
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 15
                    redis-rate-limiter.burstCapacity: 30

            # Template Service (Admin) Route
            - id: template-service-route
              uri: lb://template-service
              predicates:
                - Path=/api/v1/admin/service-templates/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path: service expects /api/v1/admin/service-templates
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            # Appointment Service Route
            - id: appointment-service-route
              uri: lb://appointment-service
              predicates:
                - Path=/api/v1/appointments/**,/api/v1/bookings/**,/api/v1/timeslots/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path as appointment service expects /api/v1/appointments
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40

            # Modification Service Route
            - id: modification-service-route
              uri: lb://modification-service
              predicates:
                - Path=/api/v1/modifications/**,/api/v1/modification-requests/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 0 # Keep full path as modification service expects /api/modifications
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 15
                    redis-rate-limiter.burstCapacity: 30

            - id: api-gateway-root
              uri: lb://api-gateway
              predicates:
                - Path=/api/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 1

      # Global CORS Configuration
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false # Important: false for public endpoints
            maxAge: 3600

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

server:
  port: ${GATEWAY_PORT:8080}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# CORS and Redis config are defined under the single 'spring' mapping above

# Resilience (Resilience4j) settings
resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 100
        failureRateThreshold: 50

# Gateway default filters: timeout/retry are applied per-route or globally as needed
gateway:
  default-filters:
    - name: RequestHeaderToRequestUri

# Security: Firebase credentials should be provided to services via env or k8s secrets
firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
