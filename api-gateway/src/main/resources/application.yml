spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
      routes:
        # Chatbot Service Route - PUBLIC ACCESS (No Authentication Required)
        # IMPORTANT: This route MUST come first to have priority
        - id: chatbot-service-route
          uri: lb://chatbot-service
          predicates:
            - Path=/api/chat/**
          filters:
            - name: StripPrefix
              args:
                parts: 0 # Don't strip prefix, chatbot service expects /api/chat

        - id: user-auth-route
          uri: lb://user-auth-service
          predicates:
            - Path=/api/users/**
          filters:
            - name: StripPrefix
              args:
                parts: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        - id: api-gateway-root
          uri: lb://api-gateway
          predicates:
            - Path=/api/**
          filters:
            - name: StripPrefix
              args:
                parts: 1

      # Global CORS Configuration for all routes
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false # IMPORTANT: Must be false for public endpoints
            maxAge: 3600

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://admin:password@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${GATEWAY_PORT:8080}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# CORS and Redis config are defined under the single 'spring' mapping above

# Resilience (Resilience4j) settings
resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 100
        failureRateThreshold: 50

# Gateway default filters: timeout/retry are applied per-route or globally as needed
gateway:
  default-filters:
    - name: RequestHeaderToRequestUri

# Security: Firebase credentials should be provided to services via env or k8s secrets
firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
