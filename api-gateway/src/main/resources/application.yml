spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: user-auth-route
              uri: lb://user-auth-service
              predicates:
                - Path=/api/users/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
            - id: vehicle-service
              uri: lb://vehicle-service
              predicates:
                - Path=/api/vehicles/**
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
            - id: api-gateway-root
              uri: lb://api-gateway
              predicates:
                - Path=/api/**
              filters:
                - name: StripPrefix
                  args:
                    parts: 1
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

server:
  port: ${GATEWAY_PORT:8080}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# CORS and Redis config are defined under the single 'spring' mapping above

# Resilience (Resilience4j) settings
resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 100
        failureRateThreshold: 50

# Gateway default filters: timeout/retry are applied per-route or globally as needed
gateway:
  default-filters:
    - name: RequestHeaderToRequestUri

# Security: Firebase credentials should be provided to services via env or k8s secrets
firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
