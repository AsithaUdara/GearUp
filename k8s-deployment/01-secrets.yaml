---
# PostgreSQL Secrets
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: gearup
type: Opaque
stringData:
  postgres-password: "gearup123"
  notification-db-password: "notif123"
  user-auth-db-password: "auth123"
  template-db-password: "template123"
  payment-db-password: "payment123"
  parts-db-password: "parts123"
  chatbot-db-password: "chatbot123"
  vehicle-db-password: "vehicle123"
  customer-db-password: "customer123"
  tracking-db-password: "tracking123"
  analytical-db-password: "analytical123"
  appointment-db-password: "appointment123"
  modification-db-password: "modification123"

---
# RabbitMQ Secrets
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: gearup
type: Opaque
stringData:
  username: "guest"
  password: "guest"

---
# Eureka Secrets
apiVersion: v1
kind: Secret
metadata:
  name: eureka-secret
  namespace: gearup
type: Opaque
stringData:
  admin-username: "admin"
  admin-password: "password"

---
# Config Server Secrets
apiVersion: v1
kind: Secret
metadata:
  name: config-server-secret
  namespace: gearup
type: Opaque
stringData:
  username: "configadmin"
  password: "change-me"

---
# Firebase Secret (You'll need to create this manually with your firebase-service-account.json)
# kubectl create secret generic firebase-secret --from-file=firebase-service-account.json=path/to/your/firebase-service-account.json -n gearup
apiVersion: v1
kind: Secret
metadata:
  name: firebase-secret
  namespace: gearup
type: Opaque
data:
  # This is a placeholder. Replace with your actual base64 encoded firebase service account JSON
  # To create: cat firebase-service-account.json | base64
  firebase-service-account.json: e30K  # Empty JSON object {} in base64
