# Custom Helm Values for Docker Desktop Deployment
# This file contains environment-specific values for all services

# Common configuration shared across services
global:
  namespace: gearup
  imagePullPolicy: IfNotPresent

  # Database configuration
  postgres:
    host: postgres-service
    port: 5432

  # RabbitMQ configuration
  rabbitmq:
    host: rabbitmq-service
    port: 5672
    username: guest
    password: guest

  # Redis configuration
  redis:
    host: redis-service
    port: 6379

  # Eureka configuration
  eureka:
    url: http://service-discovery:8761/eureka/
    username: admin
    password: password

  # Config Server configuration
  configServer:
    url: http://config-server:8888
    username: configadmin
    password: change-me

  # Ollama configuration
  ollama:
    url: http://ollama-service:11434

# API Gateway specific values
api-gateway:
  image:
    repository: gearup/api-gateway
    tag: latest
  replicaCount: 2
  service:
    type: LoadBalancer  # Expose externally on Docker Desktop
    port: 8080

# Notification Service
notification-service:
  image:
    repository: gearup/notification-service
    tag: latest
  database:
    name: as_notification_service
    user: svc_notification_service

