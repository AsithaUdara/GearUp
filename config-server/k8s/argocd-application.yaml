apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/yourorg/gearup-backend.git'
    targetRevision: HEAD
    path: config-server/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
