apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: REPLACE_SERVICE_NAME-hpa
  namespace: auto-service-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: REPLACE_SERVICE_NAME
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
