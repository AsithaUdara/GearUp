apiVersion: v1
kind: Secret
metadata:
  name: firebase-service-account
  namespace: auto-service-system
type: Opaque
stringData:
  # Create this secret from your Firebase service account JSON. Example:
  # kubectl create secret generic firebase-service-account --from-file=service-account.json=./service-account.json -n auto-service-system
  service-account.json: "REPLACE_WITH_BASE64_OR_MOUNT"
