apiVersion: apps/v1
kind: Deployment
metadata:
  name: REPLACE_RELEASE_NAME-REPLACE_SERVICE_NAME
  namespace: auto-service-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: REPLACE_SERVICE_NAME
  template:
    metadata:
      labels:
        app: REPLACE_SERVICE_NAME
    spec:
      containers:
        - name: REPLACE_SERVICE_NAME
          image: "REPLACE_IMAGE_REPOSITORY:REPLACE_IMAGE_TAG"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: REPLACE_SERVICE_NAME-config
            - secretRef:
                name: REPLACE_SERVICE_NAME-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
